name: panel-customer-bot
services:
  customer:
    image: panel-customer-bot:local
    build:
      context: ../..
      dockerfile: apps/customer-bot/Dockerfile
    env_file: ./.env
    environment:
      ADMIN_BOT_USERNAME: ${BOT_USERNAME:?Set the administrative bot username through the existing base configuration}
    secrets: [customer_telegram_token]
    volumes:
      - customer-state:/state
      - customer-bridge:/customer-bridge:ro
    user: "1000:1000"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 32
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m,mode=1777"]
    healthcheck:
      test: [CMD, node, /app/apps/telegram-admin/healthcheck.mjs]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    logging:
      driver: local
      options: {max-size: 5m, max-file: "3"}
secrets:
  customer_telegram_token:
    file: ./secrets/telegram-bot-token.txt
volumes:
  customer-state:
  customer-bridge:
    external: true
    name: panel-admin-business_customer-bridge
