name: panel-admin-business
services:
  portal:
    image: panel-admin-business:local
    build:
      context: ../..
      dockerfile: apps/business/Dockerfile
    env_file: ./.env
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.50
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 48
    ports: ["127.0.0.1:8787:8787"]
    volumes:
      - business-state:/state
      - business-bridge:/business-bridge
      - media-bridge:/media-bridge:ro
      - ./guides:/guides:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    logging:
      driver: local
      options: {max-size: 5m, max-file: "3"}
volumes:
  business-state:
  media-bridge:
  business-bridge:
    external: true
    name: panel-admin-bot_business-bridge
