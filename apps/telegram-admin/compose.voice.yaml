name: panel-admin-voice
services:
  voice:
    image: panel-admin-voice:local
    build:
      context: ../..
      dockerfile: apps/telegram-admin/Dockerfile.voice
    network_mode: none
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.75
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 48
    volumes:
      - voice-bridge:/voice
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; connection=socket.socket(socket.AF_UNIX); connection.settimeout(2); connection.connect('/voice/transcribe.sock'); connection.close()"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    logging:
      driver: local
      options: {max-size: 5m, max-file: "3"}
volumes:
  voice-bridge:
    external: true
    name: panel-admin-bot_voice-bridge
