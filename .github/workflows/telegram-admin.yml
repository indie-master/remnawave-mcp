name: Telegram admin bot
on:
  push:
    paths:
      - apps/telegram-admin/**
      - apps/telegram-client/**
      - src/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/telegram-admin.yml
  pull_request:
    paths:
      - apps/telegram-admin/**
      - apps/telegram-client/**
      - src/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/telegram-admin.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run test:bot
      - run: bash -n apps/telegram-admin/configure.sh
      - name: Validate Compose using synthetic configuration only
        env:
          REMNAWAVE_BASE_URL: https://panel.example.invalid
          BOT_USERNAME: example_admin_bot
          TELEGRAM_ADMIN_ID: '123456789'
        run: |
          docker compose -f apps/telegram-admin/compose.yaml config --quiet
          docker compose -f apps/telegram-admin/compose.yaml -f apps/telegram-admin/compose.continuous.yaml -f apps/telegram-admin/compose.ai.yaml config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build without publishing an image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/telegram-admin/Dockerfile
          load: true
          push: false
          tags: panel-admin-bot:ci
      - name: Offline startup guard and non-root user
        run: |
          if docker run --rm --network none panel-admin-bot:ci; then
            echo "Unexpected live startup without approval"
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
          test "$(docker run --rm --network none --entrypoint id panel-admin-bot:ci -u)" = "1000"
      - name: Offline SQLite budget and real MCP transport in the runtime image
        run: |
          docker run --rm -i --network none --read-only --tmpfs /state:rw,uid=1000,gid=1000,size=16m --entrypoint node panel-admin-bot:ci --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createIntentStore } from '/app/apps/telegram-admin/intent-store.mjs';
          import { createBudgetedIntent } from '/app/apps/telegram-admin/budgeted-intent.mjs';
          import { connectReportMcp } from '/app/apps/telegram-admin/report-mcp.mjs';
          const store = createIntentStore({ filename: '/state/test.sqlite' });
          let calls = 0;
          const classify = createBudgetedIntent({ store, classify: async () => { calls++; return { action: 'stats', days: 3 }; } });
          await classify('Synthetic report');
          await classify('  SYNTHETIC REPORT? ');
          assert.equal(calls, 1);
          assert.equal(store.status().used, 1);
          const reports = await connectReportMcp({ stats: async () => ({ totalUsers: 10, usersOnline: 2, observedAt: '2026-10-15T12:00:00.000Z' }) });
          assert.equal((await reports.read('stats')).usersOnline, 2);
          await reports.close();
          store.close();
          console.log('Offline runtime budget and MCP checks passed; no network or model requests.');
          NODE
      - name: Build isolated AI image without credentials
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/telegram-admin/Dockerfile.ai
          load: true
          push: false
          tags: panel-admin-ai:ci
      - name: Verify pinned CLI and disabled features offline, without model inference
        run: |
          docker run --rm --network none --read-only --entrypoint node panel-admin-ai:ci --input-type=module -e 'import assert from "node:assert/strict"; import { readFileSync } from "node:fs"; import { X509Certificate } from "node:crypto"; const path = "/etc/ssl/certs/ca-certificates.crt"; assert.equal(process.env.CODEX_CA_CERTIFICATE, path); const certificates = readFileSync(path, "utf8").match(/-----BEGIN CERTIFICATE-----[\s\S]*?-----END CERTIFICATE-----/g); assert.ok(certificates?.length); for (const certificate of certificates) new X509Certificate(certificate); console.log("System CA bundle is present and parseable; TLS verification remains enabled.");'
          docker run --rm --network none --read-only --tmpfs /home/node/.codex:rw,uid=1000,gid=1000,size=16m --tmpfs /tmp:rw,uid=1000,gid=1000,size=16m --entrypoint node panel-admin-ai:ci --input-type=module -e 'import { verifyClassifierCli } from "/app/apps/telegram-admin/verify-ai-cli.mjs"; verifyClassifierCli({ requireLogin: false }); console.log("Pinned CLI and disabled features verified; no credentials or inference.");'
          test "$(docker run --rm --network none --entrypoint id panel-admin-ai:ci -u)" = "1000"
          if docker run --rm --network none panel-admin-ai:ci; then
            echo "Unexpected AI startup without approval"
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
      - name: Exercise the Unix socket and independent quota offline in the AI image
        run: |
          docker run --rm -i --network none --read-only --tmpfs /state:rw,uid=1000,gid=1000,size=16m --tmpfs /bridge:rw,uid=1000,gid=1000,size=16m --entrypoint node panel-admin-ai:ci --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createClassifierServer } from '/app/apps/telegram-admin/ai-worker.mjs';
          import { createClassifierClient } from '/app/apps/telegram-admin/ai-client.mjs';
          import { createIntentStore } from '/app/apps/telegram-admin/intent-store.mjs';
          const store = createIntentStore({ filename: '/state/test.sqlite', dailyLimit: 1 });
          let calls = 0;
          const server = createClassifierServer({ store, classify: async () => { calls++; return { action: 'stats', days: 3 }; } });
          await new Promise(resolve => server.listen('/bridge/classifier.sock', resolve));
          const classify = createClassifierClient();
          assert.deepEqual(await classify('Synthetic report'), { action: 'stats', days: 3 });
          await assert.rejects(classify('Second report'));
          assert.equal(calls, 1);
          assert.equal(store.status().used, 1);
          server.closeAllConnections();
          await new Promise(resolve => server.close(resolve));
          store.close();
          console.log('Offline socket and worker quota passed; classifier is synthetic.');
          NODE
